<!DOCTYPE html>
<html>
<head>
    <title>Gallery - Ghauri Zaki Restaurant</title>

    <style>
        body {
            font-family: Arial;
            background-color: #d9ead3;
            text-align: center;
        }

        .box {
            background-color: white;
            border: 3px solid #8b4513;
            border-radius: 15px;
            width: 80%;
            margin: 30px auto;
            padding: 30px;
        }

        img {
            width: 250px;
            height: 180px;
            object-fit: cover;
            margin: 10px;
            border: 3px solid #8b4513;
            border-radius: 10px;
        }

        a {
            color: #8b4513;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Gallery</h1>

        <hr>

        <p>Foto makanan dan suasana Ghauri Zaki Restaurant</p>

        <img src="nasi-goreng.jpg" alt="Nasi Goreng">

        <img src="ayam-bakar.jpg" alt="Ayam Bakar">

        <img src="soto.jpg" alt="Soto Ayam">

        <br><br>

        <a href="index.html">Kembali ke Home</a>

    </div>

</body>
</html>
